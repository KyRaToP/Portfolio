# Deploy static Vite SPA to GitHub Pages (base /Portfolio/).
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Do not cancel in-progress deploys — overlapping runs were cancelling
# the builds that contain the asset BASE_URL fix, leaving an old Pages site live.
concurrency:
  group: github-pages-portfolio
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      # Pass base on the CLI so Vite always prefixes assets for project Pages URL.
      - name: Build for GitHub Pages
        working-directory: frontend
        run: npm run build -- --base=/Portfolio/
        env:
          GITHUB_PAGES: "true"

      # SPA fallback: unknown paths serve index.html
      - name: Add 404.html for client routes
        run: cp frontend/dist/index.html frontend/dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
